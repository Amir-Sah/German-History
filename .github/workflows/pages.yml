# Builds the public version of the website (© images shown as credit-and-link cards) and publishes it to
# GitHub Pages at https://<owner>.github.io/<repo>/. Runs on every push to master, or by hand.
name: Publish website to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build the public site
        run: npm run build:public
      - name: Move it below /${{ github.event.repository.name }}/
        run: |
          node scripts/rebase.mjs dist-public "/${{ github.event.repository.name }}"
          node qa/rebase-check.mjs dist-public "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
